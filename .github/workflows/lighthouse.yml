name: Lighthouse audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and serve production app
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/kurio-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
      - name: Run mobile and desktop Lighthouse audits (3 samples each)
        run: |
          mkdir -p lighthouse-results
          export CHROME_PATH="$(node -e "const { chromium } = require('@playwright/test'); process.stdout.write(chromium.executablePath())")"
          for sample in 1 2 3; do
            npx lighthouse http://127.0.0.1:4173/ --preset=perf --form-factor=mobile --screenEmulation.mobile --chrome-flags="--headless --no-sandbox" --output=json --output-path="./lighthouse-results/mobile-${sample}.json"
            npx lighthouse http://127.0.0.1:4173/ --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path="./lighthouse-results/desktop-${sample}.json"
          done
      - name: Summarize median scores and Core Web Vitals
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const files = fs.readdirSync('lighthouse-results').filter((name) => name.endsWith('.json')).sort()
          const median = (values) => values.sort((a, b) => a - b)[Math.floor(values.length / 2)]
          const rows = []
          for (const mode of ['mobile', 'desktop']) {
            const reports = files.filter((name) => name.startsWith(mode)).map((name) => JSON.parse(fs.readFileSync(path.join('lighthouse-results', name), 'utf8')))
            const score = (key) => median(reports.map((report) => Math.round((report.categories[key]?.score ?? 0) * 100)))
            const metric = (key) => median(reports.map((report) => report.audits[key]?.numericValue ?? 0))
            rows.push({ mode, performance: score('performance'), accessibility: score('accessibility'), bestPractices: score('best-practices'), seo: score('seo'), lcpMs: Math.round(metric('largest-contentful-paint')), cls: Number(metric('cumulative-layout-shift').toFixed(3)), inpMs: Math.round(metric('interaction-to-next-paint')) })
          }
          const markdown = ['# Lighthouse results', '', '| Device | Performance | Accessibility | Best Practices | SEO | LCP (ms) | CLS | INP (ms) |', '|---|---:|---:|---:|---:|---:|---:|---:|', ...rows.map((row) => `| ${row.mode} | ${row.performance} | ${row.accessibility} | ${row.bestPractices} | ${row.seo} | ${row.lcpMs} | ${row.cls} | ${row.inpMs} |`), '', 'Scores and metrics are medians of three Lighthouse runs against the production build served locally in CI.', '']
          fs.writeFileSync('lighthouse-results/SUMMARY.md', markdown.join('\n'))
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown.join('\n'))
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kurio-lighthouse-reports
          path: lighthouse-results/
          retention-days: 14
